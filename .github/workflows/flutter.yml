name: Flutter M2 validation

on:
  push:
    branches: [main, feat/m2-public-feeds]
  pull_request:

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

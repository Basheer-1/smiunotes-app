name: Android M4 Staging Acceptance APK

on:
  workflow_dispatch:
    inputs:
      staging_confirmation:
        description: 'Type STAGING_QA_ONLY to authorize a debug build with gated staging login and push UI'
        type: string
        required: true

permissions:
  contents: read

jobs:
  staging-qa-apk:
    if: github.ref == 'refs/heads/feat/m4-notifications-release' && inputs.staging_confirmation == 'STAGING_QA_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging-only config
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/google-services.json
          grep -q 'applicationId = "com.smiunotes.app"' android/app/build.gradle.kts
          test -f lib/services/android_push_bridge.dart
          test -f lib/services/student_push_enrollment.dart
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build strictly isolated staging QA APK
        shell: bash
        env:
          STAGING_API_BASE: https://cyphernotes-student-staging-git-e1aba6-muhammadbasheer600-1622.vercel.app
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --dart-define=SMIUNOTES_API_BASE="$STAGING_API_BASE" \
            --dart-define=SMIUNOTES_ENABLE_STAGING_AUTH=true \
            --dart-define=SMIUNOTES_ENABLE_PRODUCTION_AUTH=false \
            --dart-define=SMIUNOTES_ENABLE_NATIVE_PUSH=true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf 'SMIUNotes STAGING DEBUG QA ONLY\nCommit: %s\nBackend: isolated Vercel staging branch alias\nBackend authentication/push must be separately enabled and device-tested\nNever distribute as production\n' "$GITHUB_SHA" \
            > build/app/outputs/flutter-apk/STAGING-QA-INFO.txt
          (cd build/app/outputs/flutter-apk && sha256sum app-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: smiunotes-m4-staging-acceptance-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/STAGING-QA-INFO.txt
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error

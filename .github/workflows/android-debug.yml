name: Android Debug Build

on:
  push:
    branches: [feat/m2-public-feeds]
  pull_request:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: android-m2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Build Android debug APK with limited network retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android build failed after 3 attempts.' >&2
              exit 1
            fi
            echo 'Gradle artifact fetch may be rate-limited; retrying...' >&2
            sleep $((attempt * 20))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: smiunotes-m2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

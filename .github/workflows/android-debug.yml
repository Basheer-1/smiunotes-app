name: Android M4 QA Debug APK

on:
  push:
    branches: [feat/m2-public-feeds]
  pull_request:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-debug.yml'

concurrency:
  group: android-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Build Android debug APK with limited network retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android build failed after 3 attempts.' >&2
              exit 1
            fi
            echo 'Gradle artifact fetch may be rate-limited; retrying...' >&2
            sleep $((attempt * 20))
          done
      - name: Record APK build provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          printf 'SMIUNotes M4 DEBUG QA ONLY\nCommit: %s\nWorkflow Run: %s\nProduction signing: NO\nBackend URL: NOT CONFIGURED\nNative push: NOT ENABLED\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/app/outputs/flutter-apk/BUILD-INFO.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smiunotes-m4-qa-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/BUILD-INFO.txt
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

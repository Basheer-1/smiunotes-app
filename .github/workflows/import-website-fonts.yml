name: Import website typography assets (one-time)

on:
  push:
    branches: [feat/updates-status-font-refresh]
    paths:
      - '.github/workflows/import-website-fonts.yml'

permissions:
  contents: write

jobs:
  import-official-open-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Vendor version-pinned SIL OFL web font assets
        shell: bash
        run: |
          set -euo pipefail
          sha=06bfe0d62a98375cb09c942fa18e68bd32cff057
          root="https://raw.githubusercontent.com/google/fonts/$sha/ofl"
          mkdir -p assets/fonts
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "$root/inter/Inter%5Bopsz%2Cwght%5D.ttf" \
            -o assets/fonts/Inter-Variable.ttf
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "$root/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" \
            -o assets/fonts/SpaceGrotesk-Variable.ttf
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "$root/inter/OFL.txt" -o assets/fonts/OFL-Inter.txt
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "$root/spacegrotesk/OFL.txt" -o assets/fonts/OFL-SpaceGrotesk.txt
          test "$(wc -c < assets/fonts/Inter-Variable.ttf)" -eq 876576
          test "$(wc -c < assets/fonts/SpaceGrotesk-Variable.ttf)" -eq 136676
          test "$(head -c 4 assets/fonts/Inter-Variable.ttf | od -An -t x1 | tr -d ' \n')" = "00010000"
          test "$(head -c 4 assets/fonts/SpaceGrotesk-Variable.ttf | od -An -t x1 | tr -d ' \n')" = "00010000"
          (cd assets/fonts && sha256sum Inter-Variable.ttf SpaceGrotesk-Variable.ttf > SHA256SUMS.txt)
          printf 'SIL Open Font License fonts from google/fonts commit %s\nInter: body font\nSpace Grotesk: headings\n' \
            "$sha" > assets/fonts/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          git rm .github/workflows/import-website-fonts.yml
          git commit -m "assets: bundle website Inter and Space Grotesk fonts for offline Flutter UI"
          git push origin HEAD:feat/updates-status-font-refresh
